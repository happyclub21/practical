
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practical Files Library</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    text-align: center;
    margin: 0;
    padding: 30px 15px;
}

h1 {
    color: #00e5ff;
    font-size: 30px;
}

.subtitle {
    color: #ddd;
    margin-bottom: 35px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.file-box {
    background: white;
    color: #222;
    padding: 30px 20px;
    margin: 25px 0;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.file-box h2 {
    color: #243b55;
}

input {
    margin: 20px 0;
    max-width: 100%;
}

button {
    background: #007bff;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin: 8px;
}

button:hover {
    background: #0056b3;
}

iframe {
    width: 100%;
    height: 400px;
    margin-top: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.status {
    color: #16803c;
    font-weight: bold;
    margin-top: 15px;
}

.footer {
    margin-top: 45px;
    color: #ccc;
    font-size: 14px;
}
</style>
</head>

<body>

<h1>📚 Practical Files Library</h1>

<p class="subtitle">
Access and download your semester practical files
</p>

<div class="container">

    <!-- SEMESTER 5 PDF -->

    <div class="file-box">

        <h2>📕 Semester 5 Practicals</h2>

        <p>Upload Sem 5 practicals PDF</p>

        <input
            type="file"
            id="pdf5"
            accept=".pdf"
        >

        <br>

        <button onclick="uploadPDF()">
            Upload PDF
        </button>

        <div id="preview5"></div>

        <a id="download5"
           style="display:none"
           download="Sem 5 practicals.nb.pdf">

            <button>Download PDF</button>

        </a>

    </div>


    <!-- SEMESTER 3 ZIP -->

    <div class="file-box">

        <h2>📦 Semester 3 Practicals</h2>

        <p>Upload sem3 ZIP file</p>

        <input
            type="file"
            id="zip3"
            accept=".zip"
        >

        <br>

        <button onclick="uploadZIP()">
            Upload ZIP
        </button>

        <br>

        <a id="download3"
           style="display:none"
           download="sem3.zip">

            <button>Download ZIP</button>

        </a>

        <div id="zipStatus" class="status"></div>

    </div>

</div>

<div class="footer">
    <p>© 2026 Practical Files Library</p>
    <p>Made for Students ❤️</p>
</div>


<script>

// SEMESTER 5 PDF UPLOAD

let pdfURL = null;
let zipURL = null;

function uploadPDF() {

    const file = document.getElementById("pdf5").files[0];

    if (!file) {
        alert("Please select a PDF file!");
        return;
    }

    if (!file.name.toLowerCase().endsWith(".pdf")) {
        alert("Please upload a valid PDF file!");
        return;
    }

    if (pdfURL) URL.revokeObjectURL(pdfURL);

    pdfURL = URL.createObjectURL(file);

    document.getElementById("preview5").innerHTML =
        `<iframe title="PDF Preview" src="${pdfURL}"></iframe>`;

    const download = document.getElementById("download5");

    download.href = pdfURL;
    download.style.display = "inline-block";

}


// SEMESTER 3 ZIP UPLOAD

function uploadZIP() {

    const file = document.getElementById("zip3").files[0];

    if (!file) {
        alert("Please select sem3.zip!");
        return;
    }

    if (!file.name.toLowerCase().endsWith(".zip")) {
        alert("Please upload a valid ZIP file!");
        return;
    }

    if (zipURL) URL.revokeObjectURL(zipURL);

    zipURL = URL.createObjectURL(file);

    const download = document.getElementById("download3");

    download.href = zipURL;
    download.style.display = "inline-block";

    document.getElementById("zipStatus").innerText =
        "✓ ZIP file uploaded successfully!";

}

</script>

</body>
</html>
