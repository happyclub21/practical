
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practical Files Library</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    text-align: center;
    margin: 0;
    padding: 30px 15px;
}

h1 {
    color: #00e5ff;
    font-size: 32px;
}

.subtitle {
    color: #ddd;
    margin-bottom: 35px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.file-box {
    background: white;
    color: #222;
    padding: 30px 20px;
    margin: 25px 0;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.file-box h2 {
    color: #243b55;
}

.file-icon {
    font-size: 50px;
    margin: 10px;
}

.file-name {
    color: #555;
    font-size: 14px;
    overflow-wrap: anywhere;
}

button {
    background: #007bff;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin: 12px;
}

button:hover {
    background: #0056b3;
}

a {
    text-decoration: none;
}

.footer {
    margin-top: 45px;
    color: #ccc;
    font-size: 14px;
}
</style>

</head>

<body>

<h1>📚 Practical Files Library</h1>

<p class="subtitle">
Download your semester practical files easily
</p>

<div class="container">

    <!-- SEMESTER 5 MATHEMATICA NOTEBOOK -->

    <div class="file-box">

        <div class="file-icon">📘</div>

        <h2>Semester 5 Practicals</h2>

        <p class="file-name">
            Sem 5 practicals.nb
        </p>

        <a href="./Sem%205%20practicals.nb"
           target="_blank">

            <button>
                View Notebook
            </button>

        </a>

        <a href="./Sem%205%20practicals.nb"
           download="Sem 5 practicals.nb">

            <button>
                Download NB File
            </button>

        </a>

    </div>


    <!-- SEMESTER 3 ZIP -->

    <div class="file-box">

        <div class="file-icon">📦</div>

        <h2>Semester 3 Practicals</h2>

        <p class="file-name">
            sem3.zip
        </p>

        <a href="./sem3.zip"
           download="sem3.zip">

            <button>
                Download ZIP
            </button>

        </a>

    </div>

</div>

<div class="footer">

    <p>© 2026 Practical Files Library</p>
    <p>Made for Students ❤️</p>

</div>

</body>
</html>
